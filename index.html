    <style>
        :root {
            --bg-color: #f7f5f0;           /* Bone / Off-White */
            --card-bg: #ffffff;            /* Pure Crisp Card */
            --text-primary: #111827;       /* Deep Charcoal */
            --text-secondary: #4b5563;     /* Muted Grey */
            --brand-accent: #004B87;       /* Lokmera Navy Blue */
            --border-color: #e5e0d8;       /* Subtle Embossed Border */
            --shadow-subtle: 0 20px 40px -15px rgba(0, 0, 0, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Subtle tactile grain */
            background-image: radial-gradient(#e2ded4 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: var(--shadow-subtle);
            position: relative;
        }

        /* Company Header */
        .company-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 32px;
        }

        .company-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--brand-accent);
            text-transform: uppercase;
        }

        .company-tag {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Personal Info Block */
        .person-info {
            margin-bottom: 28px;
        }

        .name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            line-height: 1.15;
            margin-bottom: 6px;
        }

        .title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--brand-accent);
            font-weight: 600;
        }

        /* Highlighted Main Phone Call to Action */
        .mobile-highlight {
            background-color: #faf9f6;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-decoration: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .mobile-highlight:hover {
            border-color: var(--brand-accent);
            background-color: #ffffff;
        }

        .mobile-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .mobile-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--brand-accent);
        }

        /* QR Code Block */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #faf9f6;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .qr-box {
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .qr-box svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .qr-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 12px;
        }

        /* Details List */
        .details-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
            font-size: 0.85rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .detail-value {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 400;
            line-height: 1.4;
        }

        a.detail-value:hover {
            color: var(--brand-accent);
        }

        /* Footer / Watermark */
        .card-footer {
            margin-top: 32px;
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: #a39d93;
            text-transform: uppercase;
        }
    </style>
